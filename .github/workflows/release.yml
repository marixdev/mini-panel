name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: |
          go vet ./...
          go vet -tags cloud ./cmd/mpn

      # The web mail the panel installs is pinned by URL and SHA-256 in internal/mail/webmail.go. A release whose pin
      # does not match the published mpn-mail binary would fail on every machine, so the release stops here instead.
      - name: Check the pinned web mail
        run: |
          set -euo pipefail
          ver=$(sed -n 's/^\s*WebmailVersion *= *"\(.*\)"/\1/p' internal/mail/webmail.go)
          for arch in amd64 arm64; do
            A=$(echo "$arch" | tr a-z A-Z)
            sum=$(sed -n "s/^\s*webmailSHA256${A} *= *\"\(.*\)\"/\1/p" internal/mail/webmail.go)
            url="https://github.com/marixdev/mpn-mail/releases/download/v${ver}/mpn-mail_linux_${arch}"
            curl -fsSL -o "/tmp/mpn-mail-${arch}" "$url"
            got=$(sha256sum "/tmp/mpn-mail-${arch}" | cut -d' ' -f1)
            [ -n "$sum" ] && [ "$got" = "$sum" ] || { echo "::error::$url has SHA-256 $got, the panel pins '$sum'"; exit 1; }
            echo "web mail v${ver} ${arch} matches the pin"
          done

      - name: Build
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p release
          # mpn is built without rclone so that it starts fast (the panel runs it several times per page); mpn-cloud is the same
          # program with rclone, and mpn hands the commands that talk to off-site storage over to it.
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
              -o "release/mpn_linux_${arch}" ./cmd/mpn
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -tags cloud -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
              -o "release/mpn-cloud_linux_${arch}" ./cmd/mpn
          done
          [ "$(./release/mpn_linux_amd64 version)" = "$VERSION" ] || { echo "::error::binary version does not match the tag"; exit 1; }
          [ "$(./release/mpn-cloud_linux_amd64 version)" = "$VERSION" ] || { echo "::error::mpn-cloud version does not match the tag"; exit 1; }
          if go version -m release/mpn_linux_amd64 | grep -q rclone; then echo "::error::mpn must not contain rclone"; exit 1; fi
          cd release && sha256sum mpn_linux_* mpn-cloud_linux_* > SHA256SUMS && cat SHA256SUMS

      # mpn update trusts a release only when SHA256SUMS is signed with the key built into the program (internal/update). The
      # trusted comment names the version, so an old release cannot be passed off as a new one. The secret key is the secret
      # MPN_RELEASE_KEY; it is written to a file only for this step.
      - name: Sign
        env:
          MPN_RELEASE_KEY: ${{ secrets.MPN_RELEASE_KEY }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          [ -n "$MPN_RELEASE_KEY" ] || { echo "::error::the secret MPN_RELEASE_KEY is missing"; exit 1; }
          curl -fsSL -o /tmp/minisign.tar.gz https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz
          echo "9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73  /tmp/minisign.tar.gz" | sha256sum -c -
          tar -xzf /tmp/minisign.tar.gz -C /tmp
          MS=/tmp/minisign-linux/x86_64/minisign
          umask 077
          printf '%s\n' "$MPN_RELEASE_KEY" > /tmp/mpn-release.key
          "$MS" -S -s /tmp/mpn-release.key -m release/SHA256SUMS -t "mpn ${VERSION}"
          rm -f /tmp/mpn-release.key
          pub=$(sed -n 's/^const ReleaseKey = "\(.*\)"/\1/p' internal/update/update.go)
          "$MS" -V -P "$pub" -m release/SHA256SUMS
          cat release/SHA256SUMS.minisig

      # The notes of the release are this version's section of CHANGELOG.md.
      - name: Release notes
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '/^## \[/{p = index($0, "## [" v "]") == 1; next} p' CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || { echo "::error::CHANGELOG.md has no section for $VERSION"; exit 1; }
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Mini Panel ${{ github.ref_name }}
          files: release/*
          body_path: release-notes.md
          generate_release_notes: true

      # The same notes go to the Releases topic of the Telegram group (t.me/minipanelbiz). The topic is closed, so members only
      # read it; the bot is an admin and may still post. A failure here does not undo the release, which is already published.
      - name: Post to Telegram
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT: '-1006058347558'
          TELEGRAM_TOPIC: '4'
        run: |
          python3 .github/scripts/telegram-release.py "${GITHUB_REF_NAME#v}" release-notes.md \
            "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"
