<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>No website here</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f8f7; --fg: #1d2b29; --muted: #5d6e6b; --card: #ffffff; --line: #dfe6e3; --primary: #1f6f63;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #111917; --fg: #e5ecea; --muted: #9aaba7; --card: #18221f; --line: #2a3733; --primary: #5fc2b1; }
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100svh; display: grid; place-items: center; padding: 24px 16px;
      background: var(--bg); color: var(--fg); line-height: 1.55;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    main { width: 100%; max-width: 520px; padding: 32px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); }
    .mark { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 6px; background: var(--primary); color: var(--card); }
    h1 { margin-top: 20px; font-size: 22px; font-weight: 700; }
    p { margin-top: 10px; color: var(--muted); font-size: 15px; }
    code { padding: 1px 6px; border-radius: 4px; background: var(--bg); color: var(--fg); font-size: 14px; word-break: break-all; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="8" x="2" y="2" rx="2"/><rect width="20" height="8" x="2" y="14" rx="2"/><line x1="6" x2="6.01" y1="6" y2="6"/><line x1="6" x2="6.01" y1="18" y2="18"/></svg>
    </div>
    <h1 id="t">No website at this address</h1>
    <p id="d">The server is running, but no website is set up for <code id="h"></code>. If this is your domain, add it to a website in the control panel.</p>
  </main>
  <script>
    (function () {
      var host = location.hostname;
      var h = document.getElementById('h');
      h.textContent = host;
      if (!/^vi\b/i.test(navigator.language || '')) return;
      document.documentElement.lang = 'vi';
      document.title = 'Chưa có website';
      document.getElementById('t').textContent = 'Chưa có website ở địa chỉ này';
      var d = document.getElementById('d');
      d.textContent = 'Máy chủ đang chạy, nhưng chưa có website nào dùng ';
      d.appendChild(h);
      d.appendChild(document.createTextNode('. Nếu đây là tên miền của bạn, hãy thêm nó vào một website trong bảng điều khiển.'));
    })();
  </script>
</body>
</html>
