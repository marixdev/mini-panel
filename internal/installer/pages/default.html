<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>No website here</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f8f7; --fg: #1d2b29; --muted: #5d6e6b; --card: #ffffff; --line: #dfe6e3; --primary: #1f6f63;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #111917; --fg: #e5ecea; --muted: #9aaba7; --card: #18221f; --line: #2a3733; --primary: #5fc2b1; }
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100svh; display: grid; place-items: center; padding: 24px 16px;
      background: var(--bg); color: var(--fg); line-height: 1.55;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    main { width: 100%; max-width: 520px; padding: 32px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); }
    .mark { display: block; width: 44px; height: 44px; }
    h1 { margin-top: 20px; font-size: 22px; font-weight: 700; }
    p { margin-top: 10px; color: var(--muted); font-size: 15px; }
    code { padding: 1px 6px; border-radius: 4px; background: var(--bg); color: var(--fg); font-size: 14px; word-break: break-all; }
  </style>
</head>
<body>
  <main>
    <svg class="mark" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="900 1221 6700 6700" width="44" height="44">

      <path fill="#5569BF" d="M6474.81 2288.09c-87.88,0 -159.81,0.01 -159.81,0.07 0,-0 -35.94,62.35 -79.9,138.43l-2361.19 4089.68c-43.94,76.08 -8,138.37 79.93,138.37l1215.54 0c87.92,0 195.76,-62.29 239.61,-138.37l826.12 -1430.74c43.95,-76.14 79.89,-66.47 79.89,21.41l0 1387.93c0,87.88 71.91,159.78 159.8,159.78l1009.88 0c87.91,0 159.8,-71.9 159.8,-159.78l0 -4046.97c0,-87.91 -71.9,-159.8 -159.8,-159.8l-1009.88 -0.01z"/>
      <path fill="#3949AB" d="M3796.34 5106.94l0 1025.07 1329.52 -2302.76 0 -1381.35c0,-87.91 -71.92,-159.8 -159.82,-159.8l-1009.9 -0.01c-87.86,0 -159.8,0.01 -159.8,0.07 0,-0 -35.96,62.35 -79.9,138.43l-2361.24 4089.68c-43.89,76.08 -7.92,138.37 79.93,138.37l1215.59 0c87.87,0 195.73,-62.29 239.65,-138.37l826.07 -1430.74c43.94,-76.14 79.9,-66.47 79.9,21.4z"/>
    </svg>
    <h1 id="t">No website at this address</h1>
    <p id="d">The server is running, but no website is set up for <code id="h"></code>. If this is your domain, add it to a website in the control panel.</p>
  </main>
  <script>
    (function () {
      var host = location.hostname;
      var h = document.getElementById('h');
      h.textContent = host;
      if (!/^vi\b/i.test(navigator.language || '')) return;
      document.documentElement.lang = 'vi';
      document.title = 'Chưa có website';
      document.getElementById('t').textContent = 'Chưa có website ở địa chỉ này';
      var d = document.getElementById('d');
      d.textContent = 'Máy chủ đang chạy, nhưng chưa có website nào dùng ';
      d.appendChild(h);
      d.appendChild(document.createTextNode('. Nếu đây là tên miền của bạn, hãy thêm nó vào một website trong bảng điều khiển.'));
    })();
  </script>
</body>
</html>
