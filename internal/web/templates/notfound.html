{{define "content"}}<!doctype html>
<html lang="{{lang}}" class="h-full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>{{T "notfound.document.title"}}</title>
<link rel="icon" type="image/svg+xml" href="{{asset "logo.svg"}}">
<link rel="preload" href="{{asset "jbmono-latin.woff2"}}" as="font" type="font/woff2" crossorigin>
<script src="{{asset "theme.js"}}"></script>
<link rel="stylesheet" href="{{asset "app.css"}}">
</head>
<body class="bg-background text-foreground">
<main class="relative flex min-h-svh flex-col items-center justify-center overflow-hidden px-6 py-16 text-center">
  <div class="absolute inset-x-0 top-0 flex items-center justify-between px-6 py-5 sm:px-10">
    <a class="flex items-center gap-2.5 no-underline" href="/">
      <img src="{{asset "logo.svg"}}" alt="" class="size-9" width="36" height="36">
      <span class="text-lg font-bold tracking-tight text-foreground">{{T "app.name"}}</span>
    </a>
    {{template "language" .}}
    <span class="badge-gray">{{T "notfound.badge"}}</span>
  </div>

  <div aria-hidden="true" class="pointer-events-none select-none text-[clamp(120px,26vw,260px)] font-bold leading-none tracking-[-0.06em] text-primary/15">404</div>

  <div class="-mt-6 max-w-md sm:-mt-12">
    <h1 class="text-[clamp(26px,4vw,36px)] font-semibold leading-tight tracking-tight">{{T "notfound.heading"}}</h1>
    <p class="mt-3 text-sm leading-relaxed text-muted-foreground">{{T "notfound.description"}}</p>
    <div class="mt-8 flex flex-wrap items-center justify-center gap-3">
      <a class="btn-primary px-5 py-2.5" href="/">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3.5 11 8.5-7 8.5 7M6 9.5V19a1 1 0 0 0 1 1h3.5v-5h3v5H17a1 1 0 0 0 1-1V9.5"/></svg>
        {{T "notfound.home"}}
      </a>
      <a class="btn-secondary px-5 py-2.5" href="/" data-history-back>
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5m0 0 6-6m-6 6 6 6"/></svg>
        {{T "notfound.back"}}
      </a>
    </div>
  </div>

  <p class="absolute bottom-6 text-[11px] text-muted-foreground">Mini Panel</p>
</main>
<script src="{{asset "app.js"}}" defer></script>
</body>
</html>
{{end}}
