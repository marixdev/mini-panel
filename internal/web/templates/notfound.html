{{define "authtitle"}}{{T "notfound.document.title"}}{{end}}
{{define "content"}}<div class="w-full max-w-md text-center">
  <div aria-hidden="true" class="text-primary/15 text-[clamp(96px,22vw,168px)] leading-none font-bold tracking-tighter select-none">404</div>
  <h1 class="h-page -mt-2">{{T "notfound.heading"}}</h1>
  <p class="text-muted-foreground mt-2 text-sm leading-relaxed">{{T "notfound.description"}}</p>
  <div class="mt-6 flex flex-wrap items-center justify-center gap-3">
    <a class="btn-primary" href="/">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3.5 11 8.5-7 8.5 7M6 9.5V19a1 1 0 0 0 1 1h3.5v-5h3v5H17a1 1 0 0 0 1-1V9.5"/></svg>
      {{T "notfound.home"}}
    </a>
    <a class="btn-secondary" href="/" data-history-back>
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5m0 0 6-6m-6 6 6 6"/></svg>
      {{T "notfound.back"}}
    </a>
  </div>
</div>{{end}}
