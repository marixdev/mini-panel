{{define "content"}}
<div class="mx-auto max-w-xl">
  <h1 class="h-page">{{T "fm.rename.title"}}</h1>
  <form method="post" action="/sites/{{.Site.Name}}/files/rename" class="card mt-6 space-y-4 p-6">
    <input type="hidden" name="csrf" value="{{.CSRF}}">
    <input type="hidden" name="dir" value="{{.Dir}}">
    <input type="hidden" name="path" value="{{if .Dir}}{{.Dir}}/{{end}}{{.FileName}}">
    <div>
      <label for="newname" class="label">{{T "fm.rename.new"}}</label>
      <input id="newname" name="newname" class="field font-mono" value="{{.FileName}}" autocomplete="off" required maxlength="255" autofocus>
    </div>
    <div class="flex items-center gap-3">
      <button class="btn-primary">{{T "fm.rename.btn"}}</button>
      <a class="btn-secondary" href="/sites/{{.Site.Name}}/files{{if .Dir}}?path={{.Dir}}{{end}}">{{T "c.cancel"}}</a>
    </div>
  </form>
</div>
{{end}}
