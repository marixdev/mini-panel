{{define "app"}}<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{{.Title}} · {{T "app.name"}}</title>
<link rel="icon" type="image/svg+xml" href="{{asset "logo.svg"}}">
<link rel="preload" href="{{asset "jbmono-latin.woff2"}}" as="font" type="font/woff2" crossorigin>
<script src="{{asset "theme.js"}}"></script>
<link rel="stylesheet" href="{{asset "app.css"}}">
</head>
<body class="min-h-screen">
<a href="#main" class="sr-only focus:not-sr-only focus:fixed focus:top-4 focus:left-4 focus:z-50 focus:rounded-md focus:bg-primary focus:px-4 focus:py-2 focus:text-sm focus:font-semibold focus:text-primary-foreground">{{T "nav.skip"}}</a>

<!-- One bar that stays at the top: the brand, the links, and the person's controls. On a narrow screen the links drop to a row of their own. -->
<header class="border-border bg-background/80 sticky top-0 z-30 border-b backdrop-blur-xl">
  <div class="mx-auto flex max-w-6xl flex-wrap items-center gap-x-4 gap-y-1 px-4 py-2 sm:px-6 lg:flex-nowrap">
    <a href="/" class="flex shrink-0 items-center gap-2.5 rounded-lg focus:outline-none focus-visible:ring-2 focus-visible:ring-ring">
      <img src="{{asset "logo.svg"}}" alt="" class="size-8" width="32" height="32">
      <span class="text-sm font-bold tracking-tight">{{T "app.name"}}</span>
    </a>
    <div class="bg-border hidden h-6 w-px shrink-0 lg:block" aria-hidden="true"></div>
    <nav role="navigation" aria-label="{{T "nav.main"}}" class="order-last flex w-full items-center gap-1 overflow-x-auto lg:order-none lg:w-auto">
      <a href="/" class="nav-link"{{if eq .Nav "sites"}} aria-current="page"{{end}}>{{T "nav.websites"}}</a>
      <a href="/email" class="nav-link"{{if eq .Nav "email"}} aria-current="page"{{end}}>{{T "nav.email"}}</a>
      <a href="/monitor" class="nav-link"{{if eq .Nav "monitor"}} aria-current="page"{{end}}>{{T "nav.monitor"}}</a>
      <a href="/firewall" class="nav-link"{{if eq .Nav "firewall"}} aria-current="page"{{end}}>{{T "nav.firewall"}}</a>
      <a href="/services" class="nav-link"{{if eq .Nav "services"}} aria-current="page"{{end}}>{{T "nav.services"}}</a>
      <a href="/security" class="nav-link"{{if eq .Nav "security"}} aria-current="page"{{end}}>{{T "nav.security"}}</a>
    </nav>
    <div class="ml-auto flex shrink-0 items-center gap-2">
      <button type="button" data-theme-toggle title="{{T "theme.toggle"}}" aria-label="{{T "theme.toggle"}}" class="ico-btn">
        <svg viewBox="0 0 24 24" class="size-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg>
      </button>
      <div class="relative" data-menu>
        <button type="button" data-menu-button aria-haspopup="menu" aria-expanded="false" aria-controls="user-menu" class="menu-trigger">
          <span class="bg-primary/15 text-primary grid size-6 place-items-center rounded-full" aria-hidden="true"><svg viewBox="0 0 24 24" class="size-3.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></span>
          <span class="hidden font-medium sm:inline">{{.User}}</span>
          <svg viewBox="0 0 24 24" class="text-muted-foreground size-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div id="user-menu" data-menu-panel hidden role="menu" aria-label="{{T "user.menu"}}" class="menu-panel">
          <div class="border-border border-b px-3 py-2">
            <p class="text-muted-foreground text-xs">{{T "user.signedin"}}</p>
            <p class="truncate font-mono text-sm font-medium">{{.User}}</p>
          </div>
          <div class="p-1">
            <a role="menuitem" href="/settings" class="menu-item">
              <svg viewBox="0 0 24 24" class="size-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
              {{T "user.settings"}}
            </a>
            <form method="post" action="/logout" role="none"><input type="hidden" name="csrf" value="{{.CSRF}}">
              <button role="menuitem" class="menu-item w-full text-left">
                <svg viewBox="0 0 24 24" class="size-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
                {{T "user.logout"}}
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</header>

<main id="main" class="mx-auto max-w-6xl px-4 py-8 sm:px-6">
{{template "content" .}}
</main>
<script src="{{asset "app.js"}}" defer></script>
</body>
</html>{{end}}
