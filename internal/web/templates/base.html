{{define "app"}}<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{{.Title}} · {{T "app.name"}}</title>
<script src="{{asset "theme.js"}}"></script>
<link rel="stylesheet" href="{{asset "app.css"}}">
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 antialiased dark:bg-slate-950 dark:text-slate-100">
<header class="sticky top-0 z-10 border-b border-slate-200 bg-white/90 backdrop-blur dark:border-slate-800 dark:bg-slate-900/90">
  <div class="mx-auto flex max-w-6xl flex-wrap items-center gap-x-6 gap-y-2 px-4 py-3">
    <a href="/" class="flex items-center gap-2.5 rounded-lg focus:outline-none focus-visible:ring-2 focus-visible:ring-teal-500">
      <span class="grid size-9 place-items-center rounded-lg bg-teal-600 text-white" aria-hidden="true">
        <svg viewBox="0 0 24 24" class="size-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="6" rx="1.5"/><rect x="3" y="14" width="18" height="6" rx="1.5"/><path d="M7 7h.01M7 17h.01M11 7h6M11 17h6"/></svg>
      </span>
      <span class="font-semibold tracking-tight">{{T "app.name"}}</span>
    </a>
    <nav class="order-last flex w-full gap-1 overflow-x-auto sm:order-none sm:w-auto">
      <a href="/" class="nav-link"{{if eq .Nav "sites"}} aria-current="page"{{end}}>{{T "nav.websites"}}</a>
      <a href="/databases" class="nav-link"{{if eq .Nav "databases"}} aria-current="page"{{end}}>{{T "nav.databases"}}</a>
      <a href="/backups" class="nav-link"{{if eq .Nav "backups"}} aria-current="page"{{end}}>{{T "nav.backups"}}</a>
      <a href="/monitor" class="nav-link"{{if eq .Nav "monitor"}} aria-current="page"{{end}}>{{T "nav.monitor"}}</a>
      <a href="/firewall" class="nav-link"{{if eq .Nav "firewall"}} aria-current="page"{{end}}>{{T "nav.firewall"}}</a>
    </nav>
    <div class="ml-auto flex items-center gap-2">
      <span class="hidden text-sm text-slate-500 sm:inline dark:text-slate-400">{{.User}}</span>
      <button type="button" data-theme-toggle title="{{T "theme.toggle"}}" aria-label="{{T "theme.toggle"}}" class="grid size-9 place-items-center rounded-lg text-slate-500 hover:bg-slate-100 hover:text-slate-800 focus:outline-none focus-visible:ring-2 focus-visible:ring-teal-500 dark:text-slate-400 dark:hover:bg-slate-800 dark:hover:text-white">
        <svg viewBox="0 0 24 24" class="size-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg>
      </button>
      <form method="post" action="/logout"><input type="hidden" name="csrf" value="{{.CSRF}}"><button class="btn-secondary px-3 py-1.5">{{T "user.logout"}}</button></form>
    </div>
  </div>
</header>
<main class="mx-auto max-w-6xl px-4 py-8">
{{template "content" .}}
</main>
<script src="{{asset "app.js"}}" defer></script>
</body>
</html>{{end}}
