{{define "authtitle"}}{{T "setup.document.title"}}{{end}}
{{define "content"}}<div class="w-full max-w-sm">
  <div class="mb-6 text-center">
    <img src="{{asset "logo.svg"}}" alt="" class="mx-auto size-12" width="48" height="48">
    <p class="mt-4"><span class="badge-teal">{{T "setup.badge"}}</span></p>
    <h1 class="h-page mt-3">{{T "setup.heading"}}</h1>
    <p class="text-muted-foreground mt-1.5 text-sm">{{T "setup.description"}}</p>
  </div>
  <div class="card p-6">
    {{if .Error}}
    <div class="alert-error mb-4" role="alert">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mt-0.5 shrink-0" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
      <span>{{.Error}}</span>
    </div>
    {{end}}
    <form method="post" action="/setup" class="space-y-4">
      <div>
        <label class="label" for="user">{{T "auth.username"}}</label>
        <input id="user" name="user" type="text" autocomplete="username" required autofocus pattern="[a-z][a-z0-9_\-]{0,31}" placeholder="admin" class="field">
        <p class="hint">{{T "setup.username.hint"}}</p>
      </div>
      <div>
        <label class="label" for="password">{{T "auth.password"}}</label>
        <div class="relative">
          <input id="password" name="password" type="password" autocomplete="new-password" required minlength="12" class="field pr-16">
          <button type="button" aria-label="{{T "auth.password.show.label"}}" aria-pressed="false" data-toggle-pw="password" data-show="{{T "auth.password.show"}}" data-hide="{{T "auth.password.hide"}}" class="pw-toggle">{{T "auth.password.show"}}</button>
        </div>
        <p class="hint">{{T "setup.password.hint"}}</p>
      </div>
      <div>
        <label class="label" for="password2">{{T "setup.password.confirm"}}</label>
        <div class="relative">
          <input id="password2" name="password2" type="password" autocomplete="new-password" required minlength="12" class="field pr-16">
          <button type="button" aria-label="{{T "auth.password.show.label"}}" aria-pressed="false" data-toggle-pw="password2" data-show="{{T "auth.password.show"}}" data-hide="{{T "auth.password.hide"}}" class="pw-toggle">{{T "auth.password.show"}}</button>
        </div>
      </div>
      <button class="btn-primary w-full py-2.5" type="submit">{{T "setup.submit"}}</button>
    </form>
  </div>
</div>{{end}}
