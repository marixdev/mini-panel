{{define "content"}}
<div class="mb-3">
  <a class="inline-flex items-center gap-1.5 text-sm link" href="/sites/{{.Site.Name}}/files{{if .Dir}}?path={{.Dir}}{{end}}">{{template "fmbtn" "up"}}<span>{{T "fm.back"}}</span></a>
</div>
{{if .Notice}}{{if .Notice.OK}}<div role="status" class="alert-ok mb-3"><span>{{.Notice.Title}}</span></div>{{end}}{{end}}
{{if .Error}}<div role="alert" class="alert-error mb-3"><span>{{.Error}}</span></div>{{end}}
<form id="edit-form" method="post" action="/sites/{{.Site.Name}}/files/save" class="card overflow-hidden"
  data-t-loading="{{T "fm.editor.loading"}}" data-t-plain="{{T "fm.editor.plain"}}" data-t-dirty="{{T "fm.editor.dirty"}}">
  <input type="hidden" name="csrf" value="{{.CSRF}}">
  <input type="hidden" name="path" value="{{.EditPath}}">
  <input type="hidden" name="mtime" value="{{.EditMtime}}">
  <input type="hidden" name="eol" value="{{if .CRLF}}crlf{{else}}lf{{end}}">
  <header class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-200 px-4 py-2.5 dark:border-slate-800">
    <div class="flex min-w-0 items-center gap-2.5">
      {{template "fileicon" .FileKind}}
      <h1 class="truncate font-mono text-sm font-semibold" title="{{.EditPath}}">{{.EditPath}}</h1>
      <span class="badge-gray shrink-0">{{if .CRLF}}CRLF{{else}}LF{{end}}</span>
    </div>
    <div class="flex items-center gap-3">
      <span id="edit-state" class="text-xs font-medium text-amber-600 dark:text-amber-400" aria-live="polite"></span>
      <a class="btn-secondary" href="/sites/{{.Site.Name}}/files{{if .Dir}}?path={{.Dir}}{{end}}">{{T "c.cancel"}}</a>
      <button class="btn-primary">{{T "fm.save"}}</button>
    </div>
  </header>
  <textarea id="edit-content" name="content" spellcheck="false" wrap="off" aria-label="{{.FileName}}"
    class="block h-[calc(100dvh-21rem)] min-h-[22rem] w-full resize-none border-0 bg-white p-4 font-mono text-[13px] leading-relaxed text-slate-900 focus:ring-0 focus:outline-none dark:bg-slate-950 dark:text-slate-100">{{.EditText}}</textarea>
  <div id="edit-host" hidden data-src="/static/editor/editor.js" data-name="{{.FileName}}" data-nonce="{{.Nonce}}"
    class="h-[calc(100dvh-21rem)] min-h-[22rem] overflow-hidden"></div>
  <footer class="flex flex-wrap items-center justify-between gap-2 border-t border-slate-200 bg-slate-50 px-4 py-2 text-xs text-slate-500 dark:border-slate-800 dark:bg-slate-800/40 dark:text-slate-400">
    <span>{{T "fm.editor.hint"}}</span><span>UTF-8</span>
  </footer>
</form>
<script src="{{asset "fileeditor.js"}}" defer></script>
{{end}}
