{{define "auth"}}<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{{.Title}} Â· {{T "app.name"}}</title>
<link rel="icon" type="image/svg+xml" href="{{asset "logo.svg"}}">
<script src="{{asset "theme.js"}}"></script>
<link rel="stylesheet" href="{{asset "app.css"}}">
</head>
<body class="min-h-screen bg-muted text-foreground antialiased">
<main class="mx-auto flex min-h-screen w-full max-w-md flex-col justify-center px-4 py-10">
  <div class="mb-8 flex items-center gap-3">
    <img src="{{asset "logo.svg"}}" alt="" class="size-11" width="44" height="44">
    <span class="text-lg font-semibold tracking-tight">{{T "app.name"}}</span>
  </div>
  {{template "content" .}}
  <div class="mt-6 flex justify-end">
    <button type="button" data-theme-toggle class="rounded-lg px-2.5 py-1.5 text-xs text-muted-foreground hover:bg-muted hover:text-foreground focus:outline-none focus-visible:ring-2 focus-visible:ring-ring">{{T "theme.toggle"}}</button>
  </div>
</main>
<script src="{{asset "app.js"}}" defer></script>
</body>
</html>{{end}}
