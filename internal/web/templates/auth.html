{{define "auth"}}<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>{{template "authtitle" .}}</title>
<link rel="icon" type="image/svg+xml" href="{{asset "logo.svg"}}">
<link rel="preload" href="{{asset "jbmono-latin.woff2"}}" as="font" type="font/woff2" crossorigin>
<script src="{{asset "theme.js"}}"></script>
<link rel="stylesheet" href="{{asset "app.css"}}">
</head>
<body class="min-h-svh">
<a href="#main" class="sr-only focus:not-sr-only focus:fixed focus:top-4 focus:left-4 focus:z-50 focus:rounded-md focus:bg-primary focus:px-4 focus:py-2 focus:text-sm focus:font-semibold focus:text-primary-foreground">{{T "auth.skip"}}</a>
<div class="flex min-h-svh flex-col">
  <header class="mx-auto flex w-full max-w-6xl items-center justify-between gap-4 px-4 py-3 sm:px-6">
    <a href="/" class="flex items-center gap-2.5 rounded-lg focus:outline-none focus-visible:ring-2 focus-visible:ring-ring">
      <img src="{{asset "logo.svg"}}" alt="" class="size-8" width="32" height="32">
      <span class="text-sm font-bold tracking-tight">{{T "app.name"}}</span>
    </a>
    <div class="flex items-center gap-2">
      {{template "language" .}}
      <button type="button" data-theme-toggle title="{{T "theme.toggle"}}" aria-label="{{T "theme.toggle"}}" class="ico-btn">
        <svg viewBox="0 0 24 24" class="size-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg>
      </button>
    </div>
  </header>
  <main id="main" tabindex="-1" class="flex flex-1 items-center justify-center px-4 py-10 outline-none">
{{template "content" .}}
  </main>
  {{template "footer" .}}
</div>
<script src="{{asset "app.js"}}" defer></script>
</body>
</html>{{end}}
