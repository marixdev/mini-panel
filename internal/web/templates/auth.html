{{define "auth"}}<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{{.Title}} · {{T "app.name"}}</title>
<script src="{{asset "theme.js"}}"></script>
<link rel="stylesheet" href="{{asset "app.css"}}">
</head>
<body class="min-h-screen bg-slate-100 text-slate-900 antialiased dark:bg-slate-950 dark:text-slate-100">
<main class="mx-auto flex min-h-screen w-full max-w-md flex-col justify-center px-4 py-10">
  <div class="mb-8 flex items-center gap-3">
    <span class="grid size-11 place-items-center rounded-xl bg-teal-600 text-white shadow-sm" aria-hidden="true">
      <svg viewBox="0 0 24 24" class="size-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="6" rx="1.5"/><rect x="3" y="14" width="18" height="6" rx="1.5"/><path d="M7 7h.01M7 17h.01M11 7h6M11 17h6"/></svg>
    </span>
    <span class="text-lg font-semibold tracking-tight">{{T "app.name"}}</span>
  </div>
  {{template "content" .}}
  <div class="mt-6 flex justify-end">
    <button type="button" data-theme-toggle class="rounded-lg px-2.5 py-1.5 text-xs text-slate-500 hover:bg-slate-200/70 hover:text-slate-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-teal-500 dark:text-slate-400 dark:hover:bg-slate-800 dark:hover:text-slate-200">{{T "theme.toggle"}}</button>
  </div>
</main>
<script src="{{asset "app.js"}}" defer></script>
</body>
</html>{{end}}
