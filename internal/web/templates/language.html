{{define "language"}}{{$cur := langInfo}}<div class="relative" data-menu>
  <button type="button" data-menu-button aria-haspopup="menu" aria-expanded="false" aria-controls="language-menu" title="{{T "language.label"}}" aria-label="{{T "language.label"}}" class="menu-trigger">
    <svg viewBox="0 0 24 24" class="text-muted-foreground size-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0-18"/></svg>
    <span class="font-medium sm:hidden">{{$cur.Short}}</span>
    <span class="hidden font-medium sm:inline">{{$cur.Name}}</span>
    <svg viewBox="0 0 24 24" class="text-muted-foreground size-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
  </button>
  <div id="language-menu" data-menu-panel hidden role="menu" aria-label="{{T "language.label"}}" class="menu-panel lang-panel">
    <div class="p-1">
      {{range languages}}<a role="menuitemradio" href="/language/{{.Code}}" lang="{{.Code}}" hreflang="{{.Code}}" class="menu-item" aria-checked="{{if eq $cur.Code .Code}}true{{else}}false{{end}}">{{.Name}}{{if eq $cur.Code .Code}}<svg viewBox="0 0 24 24" class="text-primary ml-auto size-4" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5 10 17.5 19 7"/></svg>{{end}}</a>
      {{end}}
    </div>
  </div>
</div>{{end}}
