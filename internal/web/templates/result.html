{{define "content"}}
<div class="mx-auto max-w-3xl">
  <h1 class="h-page">{{.Result.Title}}</h1>
  <div class="mt-5">
    {{if .Result.OK}}
    <div role="status" class="alert-ok">
      <svg viewBox="0 0 24 24" class="mt-0.5 size-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.8 2.8L16 9.5"/></svg>
      <span>{{T "res.ok"}}</span>
    </div>
    {{else}}
    <div role="alert" class="alert-error">
      <svg viewBox="0 0 24 24" class="mt-0.5 size-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
      <span>{{.Result.Error}}</span>
    </div>
    {{end}}
  </div>
  {{if .Result.Output}}
  <section class="mt-6">
    <h2 class="h-section">{{T "res.output"}}</h2>
    <pre class="mt-2 overflow-x-auto rounded-xl border border-slate-200 bg-slate-900 p-4 font-mono text-xs leading-relaxed break-all whitespace-pre-wrap text-slate-100 dark:border-slate-800 dark:bg-black">{{.Result.Output}}</pre>
    <p class="hint">{{T "res.once"}}</p>
  </section>
  {{end}}
  <div class="mt-6"><a class="btn-secondary" href="{{if .Result.Back}}{{.Result.Back}}{{else}}/{{end}}">{{T "res.back"}}</a></div>
</div>
{{end}}
