{{define "content"}}
<div class="mx-auto max-w-xl">
  <h1 class="h-page">{{T "pma.title"}}</h1>
  <p class="mt-3 text-sm text-muted-foreground">{{T "pma.opening" .PMAName}}</p>
  <p class="mt-4"><a id="pma-link" class="btn-primary" href="{{.PMALink}}" data-autonav>{{T "pma.link"}}</a></p>
  <p class="hint mt-4">{{T "pma.note" .PMAName}}</p>
</div>
{{end}}
