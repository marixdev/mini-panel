{{define "footer"}}<footer class="border-border text-muted-foreground mt-auto border-t text-xs">
  <div class="mx-auto flex w-full max-w-6xl flex-wrap items-center justify-between gap-x-6 gap-y-1 px-4 py-4 sm:px-6">
    <p class="flex flex-wrap gap-x-4 gap-y-1">
      {{with .Foot}}{{if .OS}}<span>{{.OS}}</span>{{end}}{{if .CPU}}<span>{{T "foot.cpu" .CPU}}</span>{{end}}{{if .RAM}}<span>{{T "foot.ram" .RAM}}</span>{{end}}{{end}}
    </p>
    <p>{{with .Foot}}&copy; {{.Year}} by <a href="https://mpanel.biz" target="_blank" rel="noopener noreferrer">{{T "app.name"}}</a> v{{.Version}}{{end}}</p>
  </div>
</footer>{{end}}
